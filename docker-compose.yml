# The one documented V1 install path (Part B.4 of the implementation
# specification): exactly four services, no message broker, no separate
# worker container, no reverse proxy by default.
#
#   docker compose up
#
# brings up Postgres, Redis, the combined fluxen (gateway + control)
# binary, and the dashboard.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxen
      POSTGRES_PASSWORD: fluxen
      POSTGRES_DB: fluxen
    volumes:
      - fluxen-postgres-data:/var/lib/postgresql/data
    ports:
      # Host port 5433 (not 5432) to avoid colliding with a Postgres
      # already running on the host or in another compose project.
      # Container-to-container traffic (the fluxen service) always uses
      # the internal port 5432 via the "postgres" hostname, unaffected by
      # this mapping.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxen -d fluxen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - fluxen-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluxen:
    build:
      context: .
      dockerfile: deploy/Dockerfile.fluxen
    environment:
      FLUXEN_ENV: development
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://fluxen:fluxen@postgres:5432/fluxen?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - fluxen

volumes:
  fluxen-postgres-data:
  fluxen-redis-data:
