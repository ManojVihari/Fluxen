# The one documented V1 install path (Part B.4 of the implementation
# specification): exactly four services, no message broker, no separate
# worker container, no reverse proxy by default.
#
#   docker compose up
#
# brings up Postgres, Redis, the combined fluxen (gateway + control)
# binary, and the dashboard.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxen
      POSTGRES_PASSWORD: fluxen
      POSTGRES_DB: fluxen
    volumes:
      - fluxen-postgres-data:/var/lib/postgresql/data
    ports:
      # Host port 5433 (not 5432) to avoid colliding with a Postgres
      # already running on the host or in another compose project.
      # Container-to-container traffic (the fluxen service) always uses
      # the internal port 5432 via the "postgres" hostname, unaffected by
      # this mapping. Bound to 127.0.0.1 only — still reachable from the
      # host machine for local debugging (psql, a GUI client) but never
      # exposed to the network a production host sits on; Postgres has no
      # password worth defending on the wire otherwise.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxen -d fluxen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - fluxen-redis-data:/data
    ports:
      # Bound to 127.0.0.1 only — see the postgres service's port comment
      # above for why. Redis here has no password by default; it must
      # never be reachable from outside the host.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluxen:
    build:
      context: .
      dockerfile: deploy/Dockerfile.fluxen
    environment:
      FLUXEN_ENV: development
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://fluxen:fluxen@postgres:5432/fluxen?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      # None of the variables below need to be set for `docker compose up`
      # to produce a fully working deployment. Every provider credential
      # (OpenAI, Gemini, Ollama, ...) is added from Settings > Providers in
      # the dashboard after first login, encrypted at rest with a key
      # cmd/fluxen generates itself on first boot and persists to the
      # fluxen-data volume below (see cmd/fluxen/encryption.go). These env
      # vars remain as an optional advanced path — e.g. an operator who
      # wants to inject a deployment-wide OpenAI key or manage the
      # encryption key themselves via a secrets manager instead of letting
      # Fluxen generate one.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Only useful for pointing the gateway at a mock server in local
      # development/testing; leave unset for a real deployment.
      FLUXEN_OPENAI_BASE_URL: "${FLUXEN_OPENAI_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      # Optional override — omit this and Fluxen generates and persists its
      # own key to /data on first boot. Set it only if you want to manage
      # the encryption key yourself (e.g. `openssl rand -base64 32`).
      FLUXEN_ENCRYPTION_KEY: "${FLUXEN_ENCRYPTION_KEY:-}"
      FLUXEN_DASHBOARD_ORIGIN: "http://localhost:3000"
      # Set to "true" once you put TLS in front of Fluxen (a reverse
      # proxy terminating HTTPS) so the session cookie is marked Secure.
      # Left false by default so the plain-HTTP default deployment works.
      FLUXEN_COOKIE_SECURE: "${FLUXEN_COOKIE_SECURE:-}"
    volumes:
      - fluxen-data:/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - fluxen

volumes:
  fluxen-postgres-data:
  fluxen-redis-data:
  fluxen-data:
